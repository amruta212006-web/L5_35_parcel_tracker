name: Python Static Code Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install pylint bandit flake8

      - name: Run Pylint
        run: python -m pylint parcel_tracker.py

      - name: Run Bandit
        run: python -m bandit -r parcel_tracker.py --severity-level medium

      - name: Run Flake8
        run: python -m flake8 parcel_tracker.py
